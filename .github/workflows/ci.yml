name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-foundation:
    name: World API build, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run foundation checks
        run: npm run check

  node-live-database:
    # Runs the live PostgreSQL tests against a disposable service container. The container is created for this job only,
    # listens on the runner's loopback interface, and has no password (trust authentication on the ephemeral container).
    # It is not a deployment and holds no data. The TLS live suite is not run here: it needs a TLS-enabled server and a
    # private test CA, and its tests skip with that stated reason.
    name: World API live PostgreSQL tests (disposable service)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: naija
          POSTGRES_DB: naija_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naija -d naija_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://naija@127.0.0.1:5432/naija_test?sslmode=disable
      DB_SSL: "false"
      NAIJA_ENV: test
      NAIJA_ALLOW_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with live PostgreSQL
        run: npm test
