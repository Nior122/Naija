name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-foundation:
    name: World API build, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run foundation checks
        run: npm run check
